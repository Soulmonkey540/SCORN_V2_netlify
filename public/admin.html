<!-- public/admin.html — painel administrativo (login + CRUD de produtos) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORN — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="admin-login-screen">
        <form id="login-form" class="admin-login-box">
            <h1 class="admin-login-title">SCORN — Admin</h1>
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" required>
            </div>
            <p id="login-erro" class="admin-erro"></p>
            <button type="submit" class="cart-btn admin-login-btn">Entrar</button>
        </form>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="admin-panel" class="admin-panel" style="display:none;">
        <header class="top-header">
            <h1 class="admin-title">SCORN — Admin</h1>
            <div class="header-actions">
                <button id="novo-produto-btn" class="cart-btn">+ Novo Produto</button>
                <button id="logout-btn" class="theme-btn">Sair</button>
            </div>
        </header>

        <main class="catalog-container">
            <div class="admin-filter-bar">
                <label for="admin-filter-colecao">Coleção</label>
                <select id="admin-filter-colecao">
                    <option value="all">Todas</option>
                    <option value="frosty">Frosty</option>
                    <option value="sakami">Sakami</option>
                </select>
            </div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Coleção</th>
                            <th>Preço</th>
                            <th>Tamanhos</th>
                            <th>Estoque</th>
                            <th>Destaque</th>
                            <th>Novidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-produtos-tbody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL DE PRODUTO (criar/editar) -->
    <div id="produto-overlay" class="overlay"></div>
    <div id="produto-modal" class="admin-modal">
        <div class="admin-modal-header">
            <h2 id="produto-modal-titulo">Novo Produto</h2>
            <button id="fechar-modal-btn" class="close-cart-btn">✕</button>
        </div>
        <form id="produto-form" class="admin-modal-form">
            <input type="hidden" id="produto-id">
            <div class="form-group">
                <label for="produto-nome">Nome</label>
                <input type="text" id="produto-nome" required>
            </div>
            <div class="form-group">
                <label for="produto-tipo">Tipo</label>
                <select id="produto-tipo" required>
                    <option value="camiseta">Camiseta</option>
                    <option value="calca">Calça</option>
                    <option value="casaco">Casaco</option>
                </select>
            </div>
            <div class="form-group">
                <label for="produto-preco">Preço (R$)</label>
                <input type="number" id="produto-preco" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="produto-tamanhos">Tamanhos (separados por vírgula, ex: P,M,G)</label>
                <input type="text" id="produto-tamanhos" placeholder="P,M,G" required>
            </div>
            <div class="form-group">
                <label for="produto-estoque">Estoque</label>
                <input type="number" id="produto-estoque" min="0" required>
            </div>
            <div class="form-group">
                <label for="produto-colecao">Coleção</label>
                <select id="produto-colecao" required>
                    <option value="frosty">Frosty</option>
                    <option value="sakami">Sakami</option>
                </select>
            </div>
            <div class="admin-fieldset">
                <p class="admin-fieldset-titulo">Embalagem para entrega (cálculo de frete)</p>
                <div class="form-group">
                    <label for="produto-peso">Peso embalado (kg)</label>
                    <input type="number" id="produto-peso" step="0.01" min="0" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-largura">Largura (cm)</label>
                        <input type="number" id="produto-largura" step="0.1" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-altura">Altura (cm)</label>
                        <input type="number" id="produto-altura" step="0.1" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-profundidade">Profund. (cm)</label>
                        <input type="number" id="produto-profundidade" step="0.1" min="0" required>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="produto-arquivo-imagem">Foto do produto</label>
                <input type="file" id="produto-arquivo-imagem" accept="image/*">
                <p id="upload-status" class="admin-upload-status"></p>
            </div>
            <div class="form-group">
                <label for="produto-img">URL da imagem (preenchida automaticamente, ou cole uma manualmente)</label>
                <input type="text" id="produto-img">
            </div>
            <div class="admin-checkbox-row">
                <label><input type="checkbox" id="produto-destaque"> Destaque</label>
                <label><input type="checkbox" id="produto-novidade"> Novidade</label>
            </div>
            <p id="produto-erro" class="admin-erro"></p>
            <button type="submit" class="cart-btn admin-login-btn">Salvar</button>
        </form>
    </div>

    <script src="admin.js"></script>
</body>
</html>
