<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Overlay para fechar menu/carrinho no mobile -->
        <div id="overlay" class="overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Menu</h2>
                <button id="close-sidebar" class="mobile-only-btn">✕</button>
            </div>
            <nav class="nav-menu">
                <a href="#" data-target="view-catalogo" class="menu-item active">Catálogo</a>
                <a href="#" data-target="view-destaques" class="menu-item">Destaques</a>
                <a href="#" data-target="view-novidades" class="menu-item">Novidades</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left">
                    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menu">☰</button>
                    <h1 class="logo">SCORN</h1>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">🌙</button>
                    <button id="cart-btn" class="cart-btn">
                        Carrinho (<span id="cart-count">0</span>)
                    </button>
                </div>
            </header>

            <!-- VIEW: Catálogo -->
            <div id="view-catalogo" class="view-section active">
                <section class="filters-section">
                    <div class="filters-wrapper">
                        <div class="filter-group">
                            <label for="filter-type">Tipo:</label>
                            <select id="filter-type">
                                <option value="all">Todos</option>
                                <option value="camiseta">Camisetas</option>
                                <option value="calca">Calças</option>
                                <option value="casaco">Casacos</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-size">Tamanho:</label>
                            <select id="filter-size">
                                <option value="all">Todos</option>
                                <option value="P">P</option>
                                <option value="M">M</option>
                                <option value="G">G</option>
                                <option value="GG">GG</option>
                            </select>
                        </div>
                    </div>
                </section>
                <section id="catalog-container" class="catalog-container"></section>
            </div>

            <!-- VIEW: Destaques -->
            <div id="view-destaques" class="view-section">
                <div class="page-header">
                    <h2>Mais Vendidos & Destaques</h2>
                    <p>As peças mais cobiçadas do momento.</p>
                </div>
                <section id="destaques-container" class="catalog-container"></section>
            </div>

            <!-- VIEW: Novidades -->
            <div id="view-novidades" class="view-section">
                <div class="page-header">
                    <h2>Últimos Lançamentos</h2>
                    <p>Confira o que acabou de chegar no nosso estoque.</p>
                </div>
                <section id="novidades-container" class="catalog-container"></section>
            </div>
        </main>
    </div>

    <!-- Modal do Carrinho -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Seu Carrinho</h2>
            <button id="close-cart" class="close-cart-btn">✕</button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Itens do carrinho aparecerão aqui -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">R$ 0,00</span>
            </div>
            <button id="checkout-btn" class="checkout-btn">Finalizar via PIX</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
